name: Auto Setup Vercel Project

on:
  push:
    branches:
      - main

jobs:
  setup-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Create Vercel Project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ VERCEL_TOKEN não está configurado no GitHub Secrets. Pulando etapa de criação na Vercel."
            exit 0
          fi
          
          echo "🔍 Verificando se o projeto Vercel '$REPO_NAME' já existe..."
          
          # Tenta buscar o projeto na Vercel
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$REPO_NAME")
          
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ Projeto '$REPO_NAME' já existe na Vercel. Nenhuma ação necessária."
          elif [ "$STATUS_CODE" -eq 404 ]; then
            echo "⚠️ Projeto '$REPO_NAME' não encontrado. Criando e vinculando ao GitHub..."
            
            CREATE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.vercel.com/v9/projects" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "'"$REPO_NAME"'",
                "framework": "nextjs",
                "gitRepository": {
                  "type": "github",
                  "repo": "'"$REPO_FULL_NAME"'"
                }
              }')
              
            HTTP_STATUS=$(echo "$CREATE_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$CREATE_RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
            
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
              echo "✅ Sucesso! O projeto foi criado na Vercel e o GitHub foi vinculado."
            else
              echo "❌ Falha ao criar o projeto (Status $HTTP_STATUS):"
              echo "$BODY"
              exit 1
            fi
          else
            echo "❌ Erro inesperado ao consultar a API da Vercel (Status $STATUS_CODE)"
            exit 1
          fi
